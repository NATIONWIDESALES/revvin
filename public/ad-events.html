<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Revvin ad measurement</title></head><body>
<script>
(() => {
  let id = "";
  const allowed = new Set(["PageView", "Lead", "CompleteRegistration", "PagePublished"]);
  const pending = [];
  const flush = () => {
    if (typeof window.fbq?.callMethod !== "function") return;
    for (const data of pending.splice(0)) {
      if (data.event === "CompleteRegistration" && /^reg_[0-9a-f-]{36}$/i.test(data.eventID || "")) window.fbq("track", data.event, {}, { eventID: data.eventID });
      else window.fbq(data.event === "PagePublished" ? "trackCustom" : "track", data.event);
      // SDK dispatch acknowledgment, not a guarantee of provider receipt.
      parent.postMessage({ type: "revvin-pixel-ack", id, sequence: data.sequence }, location.origin);
    }
  };
  addEventListener("message", event => {
    if (event.origin !== location.origin || event.source !== parent || event.data?.type !== "revvin-pixel") return;
    const data = event.data;
    if (!/^\d+$/.test(data.id) || !allowed.has(data.event) || !Number.isSafeInteger(data.sequence) || data.sequence < 1) return;
    if (!id) {
      id = data.id;
      const pixel = (...args) => pixel.callMethod ? pixel.callMethod.apply(pixel,args) : pixel.queue.push(args);
      pixel.queue = []; pixel.push = pixel; pixel.loaded = true; pixel.version = "2.0";
      window.fbq = pixel; window._fbq = pixel;
      const script = document.createElement("script"); script.async = true; script.src = "https://connect.facebook.net/en_US/fbevents.js"; script.onload = flush; document.head.appendChild(script);
      pixel("set", "autoConfig", false, id);
      pixel("init", id, {}, { agent: "lovable" });
    }
    if (id !== data.id) return;
    pending.push(data); flush();
  });
})();
</script>
</body></html>
