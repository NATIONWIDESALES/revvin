<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline | Revvin</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        background: #f5f4f1;
        color: #0a0a0a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 24rem;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #15803d;
        margin-bottom: 20px;
      }
      .mark img {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 22px;
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #15803d;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark"><img src="/icons/badge-96.png" alt="" /></span>
      <h1>You're offline.</h1>
      <p>Your dashboard will reload when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
